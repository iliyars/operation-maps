name: Windows CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Release build and tests
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'

    steps:
      - name: Check out sources
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore packages
        run: dotnet restore OperationMaps.slnx

      - name: Build Release
        run: dotnet build OperationMaps.slnx --configuration Release --no-restore --verbosity minimal -p:WarningsAsErrors=nullable "-flp:logfile=artifacts/ci/build.log;verbosity=normal"

      - name: Run tests
        run: dotnet test OperationMaps.slnx --configuration Release --no-build --no-restore --verbosity minimal --logger "trx;LogFileName=tests.trx" --results-directory artifacts/ci/test-results

      - name: Upload build log and test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: windows-release-checks
          path: |
            artifacts/ci/build.log
            artifacts/ci/test-results/**/*.trx
          if-no-files-found: warn
          retention-days: 14
